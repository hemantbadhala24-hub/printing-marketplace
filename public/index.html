<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Printing Marketplace</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }
    h1 {
      color: #d85a30;
      text-align: center;
    }
    .form-box {
      background: white;
      padding: 20px;
      margin: 10px auto;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form-box input, .form-box select {
      width: 100%;
      padding: 8px;
      margin: 6px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .form-box button {
      width: 100%;
      padding: 10px;
      background: #d85a30;
      color: white;
      border: none;
      border-radius: 4px;
      margin-top: 10px;
      cursor: pointer;
    }
    .user-card {
      background: white;
      padding: 15px;
      margin: 10px auto;
      max-width: 400px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .user-card h3 {
      margin: 0 0 5px 0;
      color: #333;
    }
    .user-card p {
      margin: 2px 0;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>🖨️ Printing Marketplace</h1>

  <div class="form-box">
    <h3>Naya User Register Karein</h3>
    <input type="text" id="name" placeholder="Naam">
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="email" id="email" placeholder="Email (optional)">
    <select id="role">
      <option value="customer">Customer</option>
      <option value="seller">Seller</option>
    </select>
    <button onclick="registerUser()">Register Karein</button>
  </div>

  <div id="users-list">Loading users...</div>

  <script>
    function loadUsers() {
      fetch('/users')
        .then(response => response.json())
        .then(users => {
          const container = document.getElementById('users-list');
          container.innerHTML = '';
          users.forEach(user => {
            container.innerHTML += `
              <div class="user-card">
                <h3>${user.name}</h3>
                <p>📱 ${user.phone_number}</p>
                <p>👤 Role: ${user.role}</p>
              </div>
            `;
          });
        });
    }

    function registerUser() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;

      fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: name,
          phone_number: phone,
          email: email,
          role: role
        })
      })
      .then(response => response.json())
      .then(data => {
        alert('User register ho gaya: ' + data.name);
        document.getElementById('name').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('email').value = '';
        loadUsers();
      })
      .catch(err => alert('Error: ' + err));
    }

    loadUsers();
  </script>
</body>
</html>
