<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <title>Printing Marketplace</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
    h1 { color: #d85a30; text-align: center; }
    h2 { color: #333; text-align: center; margin-top: 40px; }
    .form-box {
      background: white; padding: 20px; margin: 10px auto; max-width: 400px;
      border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .form-box input, .form-box select {
      width: 100%; padding: 8px; margin: 6px 0; border: 1px solid #ccc;
      border-radius: 4px; box-sizing: border-box;
    }
    .form-box button, .card button {
      width: 100%; padding: 10px; background: #d85a30; color: white;
      border: none; border-radius: 4px; margin-top: 10px; cursor: pointer;
    }
    .card {
      background: white; padding: 15px; margin: 10px auto; max-width: 400px;
      border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .card h3 { margin: 0 0 5px 0; color: #333; }
    .card p { margin: 2px 0; color: #666; }
  </style>
</head>
<body>
  <h1>🖨️ Printing Marketplace</h1>

  <div class="form-box">
    <h3>Naya User Register Karein</h3>
    <input type="text" id="name" placeholder="Naam">
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="email" id="email" placeholder="Email (optional)">
    <select id="role">
      <option value="customer">Customer</option>
      <option value="seller">Seller</option>
    </select>
    <button onclick="registerUser()">Register Karein</button>
  </div>

  <h2>👥 Users</h2>
  <div id="users-list">Loading...</div>

  <h2>🛍️ Available Products (Order Karein)</h2>
  <div id="listings-list">Loading...</div>

  <script>
    function loadUsers() {
      fetch('/users')
        .then(res => res.json())
        .then(users => {
          const container = document.getElementById('users-list');
          container.innerHTML = '';
          users.forEach(user => {
            container.innerHTML += `
              <div class="card">
                <h3>${user.name}</h3>
                <p>📱 ${user.phone_number}</p>
                <p>👤 Role: ${user.role}</p>
              </div>`;
          });
        });
    }

    function loadListings() {
      fetch('/listings-detailed')
        .then(res => res.json())
        .then(listings => {
          const container = document.getElementById('listings-list');
          container.innerHTML = '';
          listings.forEach(item => {
            container.innerHTML += `
              <div class="card">
                <h3>${item.product_name}</h3>
                <p>🏪 Shop: ${item.shop_name}</p>
                <p>💰 Price: ₹${item.price}</p>
                <p>📦 Stock: ${item.stock_quantity}</p>
                <button onclick="placeOrder(${item.id}, ${item.price})">Order Now</button>
              </div>`;
          });
        });
    }

    function registerUser() {
      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const email = document.getElementById('email').value;
      const role = document.getElementById('role').value;

      fetch('/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, phone_number: phone, email, role })
      })
      .then(res => res.json())
      .then(data => {
        alert('User register ho gaya: ' + data.name);
        document.getElementById('name').value = '';
        document.getElementById('phone').value = '';
        document.getElementById('email').value = '';
        loadUsers();
      })
      .catch(err => alert('Error: ' + err));
    }

    function placeOrder(listingId, price) {
      const customerId = prompt("Apni User ID daalein (jaise 1):");
      const quantity = prompt("Kitni quantity chahiye?", "1");
      const address = prompt("Delivery address daalein:");

      if (!customerId || !quantity || !address) {
        alert("Order cancel ho gaya - saari details zaroori hain");
        return;
      }

      fetch('/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          customer_id: parseInt(customerId),
          listing_id: listingId,
          quantity: parseInt(quantity),
          total_price: price * parseInt(quantity),
          delivery_address: address,
          delivery_type: 'seller_delivery'
        })
      })
      .then(res => res.json())
      .then(data => {
        alert('Order place ho gaya! Order ID: ' + data.id);
      })
      .catch(err => alert('Error: ' + err));
    }

    loadUsers();
    loadListings();
  </script>
</body>
</html>
